name: Fetch ENTSO-E prices

on:
  schedule:
    # 13:30 UTC = 15:30 Vienna time in summer (CEST, UTC+2), 14:30 in winter (CET, UTC+1).
    # Runs after the day-ahead auction clears, so tomorrow's prices are included.
    - cron: "30 13 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write  # needed to commit prices.json/prices.db back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices and update price history
        env:
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        run: |
          python fetch_entsoe_prices.py --store-db --db prices.db

      - name: Commit updated prices.json and prices.db
        if: always()  # commit whatever was fetched even if something above failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f prices.json ] || [ -f prices.db ]; then
            git add prices.json prices.db 2>/dev/null || true
            if git diff --quiet --cached; then
              echo "No changes -- nothing to commit."
            else
              git commit -m "Update prices $(date -u +%Y-%m-%d)"
              for attempt in 1 2 3; do
                if git push; then
                  echo "Pushed successfully."
                  break
                fi
                echo "Push rejected (attempt $attempt/3) -- pulling latest main and retrying..."
                git pull --rebase origin main
                if [ "$attempt" = "3" ]; then
                  echo "Push still failing after 3 attempts -- giving up for this run."
                  exit 1
                fi
              done
            fi
          else
            echo "Neither prices.json nor prices.db exist this run -- nothing to commit."
          fi
